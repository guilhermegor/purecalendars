[tool.poetry]
name = "purecalendars"
# Placeholder only — the real version is derived from the git tag at build time by
# poetry-dynamic-versioning (see [tool.poetry-dynamic-versioning]). Do not bump this by hand;
# releases are cut by tagging via the CI release workflows.
version = "0.0.0"
description = "Holiday calendars and business-day arithmetic for Brazilian and US markets, computed offline."
authors = ["guilhermegor"]
readme = "README.md"
license = "MIT"
homepage = "https://guilhermegor.github.io/purecalendars/"
documentation = "https://guilhermegor.github.io/purecalendars/"
repository = "https://github.com/guilhermegor/purecalendars"
keywords = ["calendar", "holidays", "business-days", "b3", "anbima", "febraban"]
packages = [
	{ include = "purecalendars", from = "src" },
	# Deprecated `import wwdates` alias (#83); remove in 4.0.0.
	{ include = "wwdates", from = "src" },
]
# Keep internal dev docs out of the distributed wheel/sdist.
exclude = ["src/**/CLAUDE.md"]
package-mode = true
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[tool.poetry.urls]
"Bug Reports" = "https://github.com/guilhermegor/purecalendars/issues"
"Source" = "https://github.com/guilhermegor/purecalendars"
"Documentation" = "https://guilhermegor.github.io/purecalendars/"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# Calendar core (business-day frames). No I/O dependency belongs here: live fetchers live in
# opendata-calendars, which depends on this package, never the reverse.
pandas = ">=2.1.0"
businesstimedelta = "^1.0.1"
python-dateutil = "^2.9.0.post0"
tzdata = "^2026.2"
holidays = "^0.99"
beartype = ">=0.22"
numpy = ">=1.22"
defusedxml = ">=0.7"
purepii-br = ">=2.0.0"
pure-schema-regimes = ">=0.1.0,<0.2"

[tool.commitizen]
# Conventional-commit driven changelog. The version comes from the git tag
# (poetry-dynamic-versioning); `cz changelog` groups commits by tag. Releases are cut by the CI
# release workflows (tag -> build -> publish), not by a hand-run bump.
name = "cz_conventional_commits"
version_provider = "poetry"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.1.0"
pretty-errors = ">=1.2.25"
commitizen = ">=4.4.1"
poetry-plugin-export = ">=1.8"
# Build + publish tooling for the PyPI / Test-PyPI release workflows (twine is the
# publish fallback when `poetry publish` is unavailable).
build = ">=1.2.2"
twine = ">=6.1.0"
# Pinned to the ruff-pre-commit hook minor (.pre-commit-config.yaml) so `make
# lint` and the hook never disagree on formatting/lints.
ruff = ">=0.11.13,<0.12"
codespell = ">=2.4.1"
pydocstyle = ">=6.3.0"
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
coverage = ">=7.6.0"
# genbadge replaces the abandoned coverage-badge (it imported the removed
# pkg_resources and breaks on setuptools >= 81).
genbadge = {extras = ["coverage"], version = ">=1.1.0"}
# Static type-checker + non-Python lint gates (mirrored in .pre-commit-config and
# `poe lint`). shellcheck + shfmt are pip dev-deps (shellcheck-py/shfmt-py); lint_shell.sh resolves them via poetry run, falls back to a system binary, then skips.
mypy = ">=1.8.0"
sqlfluff = ">=3.0.0"
yamllint = ">=1.35.0"
shfmt-py = ">=3.7.0"
shellcheck-py = ">=0.10.0"
pytest-mock = "^3.15.1"
poethepoet = ">=0.35"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
pymdown-extensions = ">=10.0"

[tool.poetry-dynamic-versioning]
# The published version is derived from the latest git tag matching `v$version` (e.g. v0.2.0).
# On an exact tag the build is clean (0.2.0); off-tag builds get a PEP 440 dev version. CI stamps
# a release by tagging the commit before build; Test PyPI passes POETRY_DYNAMIC_VERSIONING_BYPASS
# to build a specific version without creating a tag. Requires `python -m build` (a PEP 517
# frontend) rather than `poetry build`, so the backend below is honoured.
enable = true
vcs = "git"
style = "pep440"

[build-system]
requires = ["poetry-core>=1.7.0", "poetry-dynamic-versioning>=1.4.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
