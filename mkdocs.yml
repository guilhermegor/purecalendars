site_name: purecalendars
site_description: Global calendar system. Python package.
repo_url: https://github.com/guilhermegor/purecalendars
nav:
  - Home: index.md
  - Guide:
      - Usage: usage.md
      - Examples: examples.md
  - API Reference:
      - Overview: api/index.md
      - Reference: api/reference.md
  - Project:
      - FAQ: faq.md
      - Contributing: contributing.md
      - Changelog: changelog.md
      - Incidents: incidents.md
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
  # Native Material mechanism: places the image in the top bar left of the site name, with no
  # custom CSS, template override or build hook. The template's logo slot, filled with the real
  # purecalendars logo (same image as the README/index.md inline logo).
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # Include files from the repo root (e.g. CHANGELOG.md) into a docs page, single-sourced.
  - pymdownx.snippets:
      base_path:
        - .

extra_css:
  - stylesheets/brand.css
extra:
  version:
    provider: mike

# Non-published docs: MkDocs builds every .md under docs/, so working
# documents must be excluded here or they ship to readers.
exclude_docs: |
  # NOTE: .gitignore syntax — comments must be on their own line. A trailing
  # "# ..." after a pattern becomes part of the pattern and silently disables it.
  # design specs / working notes, not published
  superpowers/
  # docs/ authoring guidance, not a published page
  CLAUDE.md
  # offline merge-checkpoint log, internal
  checkpoints.md
  # git-ignored scaffolding-lessons record, never published
  blueprintx-lessons.md
  # git-ignored toolchain-lessons record, never published
  dotfiles-dev-lessons.md
