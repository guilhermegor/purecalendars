name: Run Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  test:
    name: Run Automated Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Must track pyproject's `python = ">=3.11,<4.0"` (the floor #89 raised; the BlueprintX
        # template matrix starts at 3.11 too). 3.10 is below the floor: no tomllib, and the
        # runner installs no tomli, so the description-sync guard cannot read the manifest.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the work-ledger gate can resolve merge-base(HEAD, origin/main). A
          # shallow clone has no common ancestor to diff the branch against; the gate reports
          # that as a failure rather than passing having examined nothing. See
          # bin/check_backlog_ledger.py.
          fetch-depth: 0

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true
          version: 2.2.1

      # Fail loud on a stale lock instead of silently regenerating it. A poetry.lock that no
      # longer matches pyproject.toml means dependencies changed without re-locking; regenerating
      # here (rm + poetry lock) would re-resolve and upgrade every dependency to the latest
      # in-range version — a non-reproducible build that can silently pull a breaking release.
      # Require an intentional `poetry lock` + commit instead. (A version bump does NOT invalidate
      # the lock — only a dependency change does.)
      #
      # This is its OWN step, deliberately. It used to live inside the cache-guarded install step
      # below, which meant that on a cache hit the guard never ran at all — the gate was disabled
      # by exactly the condition that makes it cheap to run.
      - name: Verify poetry.lock Is In Sync With pyproject.toml
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is out of sync with pyproject.toml — run 'poetry lock' locally and commit the result." >&2
            exit 1
          fi

      # The key MUST hash poetry.lock as well as pyproject.toml. Hashing pyproject.toml alone made
      # every lock-only change a cache hit — so the job restored a stale .venv, skipped the install
      # entirely, and reported green while testing the OLD dependency set. That silently defeats
      # Dependabot, whose `versioning-strategy: lockfile-only` produces precisely lock-only diffs
      # (.github/dependabot.yml).
      #
      # poetry.lock is NOT in `path:` either: caching a tracked file means a restored cache
      # overwrites the repo's committed lockfile, so the check above would validate a cache
      # artifact instead of what is actually in the tree. Cache build outputs, never source.
      - name: Load Cached Virtual Environment
        id: cached-venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      # No pyproject.toml rewriting here. The template ships a `python -c` transform that strips
      # `pywin32` / `platform = "win32"` dependencies before installing on non-Windows — correct for
      # filings-cvm, which HAS pywin32, and dead code here: wwdates declares no Windows-only
      # dependency (the `win32` strings in poetry.lock are transitive wheel FILENAMES, not
      # declarations). It copied, rewrote and restored pyproject.toml to no effect, and a failure
      # partway through would have left the rewritten file behind.
      - name: Install Dependencies
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: |
          poetry install --no-interaction --no-root
          poetry env activate

      - name: Run Spell Check (codespell)
        if: runner.os == 'Linux'
        run: |
          poetry run codespell .
          if [ $? -ne 0 ]; then
            echo "Typos found! Run 'codespell .' locally to see them."
            exit 1
          fi

      - name: Run Docstring Type Consistency Check
        if: runner.os == 'Linux'
        run: |
          poetry run python -m pydocstyle --select=D412,D417 --match="(src|tests).*\\.py" src/ tests/
          poetry run python bin/check_docstrings.py

      - name: Run Function Length Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_function_length.py

      - name: Run Fixture Scope Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_fixture_scope.py

      - name: Run Gate Integrity Enforcement
        if: runner.os == 'Linux'
        run: poetry run python bin/check_gate_integrity.py

      - name: Run Assertion Weakening Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_assertion_weakening.py

      - name: Run Complexity Gate
        if: runner.os == 'Linux'
        run: bash bin/check_complexity.sh

      - name: Run One-Assert Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_one_assert.py

      - name: Run All-Exports Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_all_exports.py

      - name: Run Comment Language Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_comment_language.py

      - name: Run Comment Budget Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_comment_budget.py --require-baseline

      - name: Run Coverage Floor Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_coverage_floor.py

      - name: Run Work-Ledger Enforcement
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        # Mirrors the `check-backlog-ledger` pre-commit hook: a branch touching any src/ci path
        # must add a flat `.specs/backlog/` work ledger. Explicit CI step for gate parity — a
        # hook-only gate is bypassed by `--no-verify`. The bot exemption reads the PR author from
        # GITHUB_EVENT_PATH, so no env wiring is needed here.
        run: poetry run python bin/check_backlog_ledger.py

      - name: Run Specs Structure Gate
        if: runner.os == 'Linux'
        run: bash bin/check_specs_structure.sh --root .

      - name: Run Required Checks Sync Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_required_checks_sync.py --required-list bin/required-checks.txt

      - name: Run Docs Boundary Gate
        if: runner.os == 'Linux'
        run: bash bin/check_docs_boundary.sh --root .

      - name: Run Identifier Masking Gate
        if: runner.os == 'Linux'
        run: poetry run python bin/check_identifier_masking.py

      - name: Run Docs Skeleton Enforcement
        if: runner.os == 'Linux'
        run: poetry run python bin/check_docs_sections.py

      - name: Run Docs Gap Gate
        if: runner.os == 'Linux'
        run: |
          python -m pip install pathspec pyyaml
          python bin/check_docs_gap.py --root .

      - name: Run Docs Code-Reference Enforcement
        if: runner.os == 'Linux'
        run: poetry run python bin/check_docs_code_refs.py

      - name: Run Description Sync
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash bin/check_description_sync.sh

      - name: Run Direct-Dependency Gate
        if: runner.os == 'Linux'
        run: bash bin/lint_deps.sh

      - name: Run Secret Scan (gitleaks)
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_REQUIRED: "1"
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          bash bin/check_secrets.sh

      - name: Run README Structure Gate
        if: runner.os == 'Linux'
        run: bash bin/check_readme_structure.sh README.md

      - name: Run Ruff Linting
        if: runner.os == 'Linux'
        run: |
          poetry run ruff check src/ tests/ --config=ruff.toml
          if [ $? -ne 0 ]; then
            echo "Ruff found issues! Run 'ruff check src/ tests/' locally see details."
            echo "To fix automatically, run: poetry run ruff check --fix src/ tests/"
            exit 1
          fi

      - name: Run Static Type Check (mypy)
        if: runner.os == 'Linux'
        # Run from src/ so it is the single package base (avoids the dual-root
        # "found twice" error on the deeper DDD tree).
        run: cd src && poetry run mypy --config-file ../mypy.ini .

      - name: Run Non-Python Lint Gates (shell, sql, yaml, actions)
        if: runner.os == 'Linux'
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        # Mirrors `poe lint` and the pre-commit lint-* hooks (one home, zero drift).
        # shellcheck/shfmt/actionlint are system tools; install them so the gates actually run
        # in CI (the wrappers skip gracefully on a box without them).
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          poetry run pip install shfmt-py >/dev/null 2>&1 || true
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          bash bin/lint_shell.sh --check
          bash bin/lint_sql.sh
          bash bin/lint_yaml.sh
          LINT_ACTIONS_REQUIRED=1 bash bin/lint_actions.sh

      - name: Run Integration Tests
        # `|| [ $? -eq 5 ]` tolerates pytest exit 5 ("no tests collected") so a
        # fresh project with an empty integration suite does not fail CI; real
        # failures (exit 1) still fail the step.
        run: poetry run pytest tests/integration/ -v || [ $? -eq 5 ]

      - name: Run Unit Tests
        run: poetry run pytest tests/unit/ || [ $? -eq 5 ]

      - name: Run Coverage Report
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          poetry run pytest --cov=src --cov-report=xml --no-header -q tests/unit/
          poetry run genbadge coverage -i coverage.xml -o coverage.svg

      - name: Upload Badge
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.svg

      - name: Run Runtime Type-Checking Enforcement
        if: runner.os == 'Linux'
        run: poetry run python bin/check_typing.py

      - name: Run Dynamic Version Stub Check
        if: runner.os == 'Linux'
        run: poetry run python bin/check_dynamic_version_stub.py

      - name: Run Numeric Dtype Policy Check
        if: runner.os == 'Linux'
        run: poetry run python bin/check_dtypes.py

      - name: Run Layer Import Policy Check
        if: runner.os == 'Linux'
        run: poetry run python bin/check_layer_imports.py

      - name: Run Docs Language Enforcement
        if: runner.os == 'Linux'
        run: poetry run python bin/check_docs_language.py
