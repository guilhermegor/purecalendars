name: Docs - Strict Build Check

# A build check only: it never deploys. The published, versioned site is deployed by the
# `deploy_docs` job of release-pypi.yaml (mike -> gh-pages), on each stable release.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so `cz changelog` and the version badge can read them.
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true

      - name: Install Docs Dependencies
        run: poetry install --with docs

      - name: Regenerate CHANGELOG.md
        run: poetry run cz changelog

      - name: Build Site (strict)
        run: poetry run mkdocs build --strict
