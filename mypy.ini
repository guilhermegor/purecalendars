[mypy]
python_version = 3.10
explicit_package_bases = True
namespace_packages = True

ignore_missing_imports = False

check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
disallow_any_explicit = True
disallow_any_generics = True

[mypy-utils.typing.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-defusedxml.*]
ignore_missing_imports = True

[mypy-win32com.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pyodbc.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True

# DEVIATION (purecalendars): the runtime type-checking engine is vendored at
# <pkg>._internal.utils.typing; it is metaprogramming mypy cannot analyse.
[mypy-*._internal.utils.typing.*]
ignore_errors = True

# DEVIATION (purecalendars): businesstimedelta ships no stubs and no py.typed marker.
[mypy-businesstimedelta.*]
ignore_missing_imports = True

# DEVIATION (purecalendars): interim until the vendored utils are refreshed from the
# template (#60); the old helper annotates its payload as Any.
[mypy-purecalendars._internal.utils.parsers.dicts]
disallow_any_explicit = False
