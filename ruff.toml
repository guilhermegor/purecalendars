line-length = 99
indent-width = 4
target-version = "py311"
exclude = [
    ".bzr",
    ".git",
    ".git-rewrite",
    ".hg",
    ".svn",

    "__pycache__",
    "__pypackages__",
    ".eggs",
    "*.egg",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",

    ".direnv",
    ".env",
    ".mypy_cache",
    ".nox",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    "venv",
    "site-packages",

    "_build",
    "buck-out",
    "build",
    "dist",

    ".ipynb_checkpoints",
    ".vscode",

    "migrations",

    ".pants.d",
    ".pyenv",
    "node_modules",
    "*.log",
]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
docstring-code-line-length = 79

[lint]
preview = true

select = [
    "UP",
    "E",
    "F",
    "ANN",
    "B",
    "SIM",
    "I",
    "AIR",
    "ERA",
    "S",
    "PD",
    "D",
    "TID",
    "W",
    "PL",
    "PT",
    "RET",
    "A",
    "BLE",
    "N",
    "PLR1702",
]
ignore = [
    "PLC1901",
]
fixable = ["I"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# purecalendars does no file or database I/O: the bare pandas readers are banned so a read
# cannot creep in. Live and tabular sources are read in opendata-calendars, which depends on
# this package, never the reverse (see AGENTS.md).
[lint.flake8-tidy-imports.banned-api]
"pandas.read_excel".msg = "purecalendars does no I/O; reading files or databases belongs in opendata-calendars."
"pandas.read_csv".msg = "purecalendars does no I/O; reading files or databases belongs in opendata-calendars."
"pandas.read_json".msg = "purecalendars does no I/O; reading files or databases belongs in opendata-calendars."
"pandas.read_table".msg = "purecalendars does no I/O; reading files or databases belongs in opendata-calendars."
"pandas.read_parquet".msg = "purecalendars does no I/O; reading files or databases belongs in opendata-calendars."
"pandas.read_sql".msg = "purecalendars does no I/O; reading files or databases belongs in opendata-calendars."
"pandas.read_sql_query".msg = "purecalendars does no I/O; reading files or databases belongs in opendata-calendars."
"pandas.read_sql_table".msg = "purecalendars does no I/O; reading files or databases belongs in opendata-calendars."
"pandas.ExcelFile".msg = "purecalendars does no I/O; reading files or databases belongs in opendata-calendars."

[lint.isort]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true
force-sort-within-sections = true
lines-after-imports = 2

[lint.pylint]
max-args = 8
max-positional-args = 12

[lint.pydocstyle]
convention = "numpy"

[lint.flake8-annotations]
suppress-none-returning = false
suppress-dummy-args = false
ignore-fully-untyped = false
allow-star-arg-any = false

[lint.per-file-ignores]
"bin/**/*.py" = ["PLC2701", "S404"]

"tests/**/*.py" = [
    "S101",
    "PLC2701",
    "PLR2004",
    "S404",
]
